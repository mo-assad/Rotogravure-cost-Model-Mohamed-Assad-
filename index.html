<!DOCTYPE html>

    <!-- تنسيقات لضبط ارتفاع الصفحة وثبات الـ Footer في الأسفل تماماً -->
    <style>
      html, body {
        height: auto !important;
        min-height: 100vh !important;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
      }
      #root {
        flex: 1 0 auto !important;
        position: relative !important;
        height: auto !important;
      }
      .ma-footer {
        flex-shrink: 0 !important;
        position: relative !important;
        width: 100% !important;
        margin-top: 40px !important;
        z-index: 10 !important;
        --ma-bg: #0f2a3d;
        --ma-text: #e8eef3;
        --ma-muted: #9fb3c2;
        --ma-accent: #3fb6a8;
        --ma-line: rgba(255, 255, 255, 0.12);
        background: var(--ma-bg);
        color: var(--ma-text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        border-top: 3px solid var(--ma-accent);
        box-sizing: border-box;
        text-align: left;
      }
      .ma-footer *,
      .ma-footer *::before,
      .ma-footer *::after {
        box-sizing: border-box;
      }
      .ma-footer__inner {
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      .ma-footer__profile {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
      }
      .ma-footer__avatar {
        width: 56px;
        height: 56px;
        flex: 0 0 56px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--ma-accent);
        background: var(--ma-line);
      }
      .ma-footer__name {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 700;
        line-height: 1.3;
        color: #fff;
      }
      .ma-footer__role {
        margin: 2px 0 0;
        font-size: 0.85rem;
        line-height: 1.45;
        color: var(--ma-muted);
      }
      .ma-footer__links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        flex: 0 0 auto;
      }
      .ma-footer__link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 16px;
        border: 1px solid var(--ma-line);
        border-radius: 999px;
        color: var(--ma-text);
        font-size: 0.9rem;
        font-weight: 500;
        text-decoration: none;
        transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
      }
      .ma-footer__link svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
        flex: 0 0 18px;
      }
      .ma-footer__link:hover {
        background: var(--ma-accent);
        border-color: var(--ma-accent);
        color: #0b1d2a;
      }
      .ma-footer__link:focus-visible {
        outline: 2px solid var(--ma-accent);
        outline-offset: 3px;
      }
      .ma-footer__bottom {
        border-top: 1px solid var(--ma-line);
        padding: 12px 24px;
        text-align: center;
        font-size: 0.78rem;
        color: var(--ma-muted);
      }

      @media (max-width: 720px) {
        .ma-footer__inner {
          flex-direction: column;
          align-items: center;
          text-align: center;
          padding: 24px 16px 20px;
        }
        .ma-footer__profile {
          flex-direction: column;
          text-align: center;
        }
        .ma-footer__avatar {
          width: 64px;
          height: 64px;
          flex-basis: 64px;
        }
        .ma-footer__links {
          justify-content: center;
          width: 100%;
        }
        .ma-footer__link {
          flex: 1 1 140px;
          justify-content: center;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ma-footer__link {
          transition: none;
        }
      }
    </style>
  </head>
  <body>

      </div>
      <div class="ma-footer__bottom">
        &copy; <span id="ma-year">2026</span> Mohamed Assad. All rights reserved.

      </script>

  </body>
</html>
